<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grm-regions-test</title>
<!-- WI-45329 GRM test page: controllably repaints separate regions so the engine sends rectangle messages with a known
     number of dirty rects. A grid of canvases is laid out with gutters (so the regions cannot merge into one rectangle);
     every tick N of them are redrawn in the SAME animation frame, i.e. one paint with N dirty regions.
     Everything is deterministic (seeded) and driven from the URL, nothing else on the page ever changes.

     Parameters (all optional):
       regions=N     cells redrawn per tick                          default 4
       rate=R        ticks per second (<= the engine frame rate)     default 10
       ticks=T       stop after T ticks (0 = run until stop())       default 100
       pattern=      fixed   evenly spaced cells, same ones each tick
                     random  seeded random cells each tick
                     sweep   a window of N cells that moves one cell per tick
       kind=         noise (large JPEG payload) | gradient | flat (tiny payload) | text
       cols, rows    grid size                                       default 6 x 4
       cw, ch        cell size in px                                 default 140 x 100
       gap           gutter between cells in px                      default 40
       offset        shift of the whole grid in px (13 = off the 32 px Xorix tile grid)  default 0
       seed          rng seed                                        default 1
       auto=1        start immediately (otherwise press Start or call __rg.start())
       ui=0          hide the control bar

     Script API: window.__rg = { cfg, start(), stop(), state() , log }.  state() -> { running, tick, done }.
     log[] has one entry per tick: { tick, t (ms since start), cells: [indices] }. -->
<style>
  html, body { margin: 0; background: #fff; font: 14px/1.4 Arial, sans-serif; color: #222; overflow: hidden; }
  #bar { position: absolute; left: 0; top: 0; width: 100%; height: 56px; background: #eef2f8; border-bottom: 1px solid #bbc; }
  #bar span { display: inline-block; margin: 17px 0 0 20px; }
  #bar button { margin-left: 12px; font-size: 14px; padding: 3px 14px; }
  canvas { position: absolute; display: block; border: 0; }
</style>
</head>
<body>
<div id="bar"><span id="desc"></span><button id="go">Start</button><button id="halt">Stop</button></div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) && Number.isFinite(+q.get(k)) ? +q.get(k) : d);
  const cfg = {
    cols: num('cols', 6), rows: num('rows', 4), cw: num('cw', 140), ch: num('ch', 100), gap: num('gap', 40),
    offset: num('offset', 0), regions: num('regions', 4), rate: num('rate', 10), ticks: num('ticks', 100),
    pattern: q.get('pattern') || 'fixed', kind: q.get('kind') || 'noise', seed: num('seed', 1),
    auto: q.get('auto') === '1', ui: q.get('ui') !== '0',
  };
  const total = cfg.cols * cfg.rows;
  cfg.regions = Math.max(1, Math.min(cfg.regions, total));

  // mulberry32: small seeded rng
  const rng = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(cfg.seed);

  const bar = document.getElementById('bar');
  if (!cfg.ui) bar.style.display = 'none';
  document.getElementById('desc').textContent =
    `regions=${cfg.regions} rate=${cfg.rate}/s ticks=${cfg.ticks} pattern=${cfg.pattern} kind=${cfg.kind} grid=${cfg.cols}x${cfg.rows} cell=${cfg.cw}x${cfg.ch} gap=${cfg.gap} offset=${cfg.offset}`;

  const top0 = 70, left0 = 20;
  const cells = [];
  for (let i = 0; i < total; i++) {
    const c = document.createElement('canvas');
    c.width = cfg.cw; c.height = cfg.ch;
    c.style.width = cfg.cw + 'px'; c.style.height = cfg.ch + 'px';
    c.style.left = (left0 + cfg.offset + (i % cfg.cols) * (cfg.cw + cfg.gap)) + 'px';
    c.style.top = (top0 + cfg.offset + Math.floor(i / cfg.cols) * (cfg.ch + cfg.gap)) + 'px';
    document.body.appendChild(c);
    cells.push(c.getContext('2d'));
  }

  const hsl = () => `hsl(${Math.floor(rng() * 360)} ${60 + Math.floor(rng() * 30)}% ${35 + Math.floor(rng() * 35)}%)`;
  function paint(ctx) {
    const w = cfg.cw, h = cfg.ch;
    if (cfg.kind === 'flat') { ctx.fillStyle = hsl(); ctx.fillRect(0, 0, w, h); }
    else if (cfg.kind === 'gradient') {
      const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, hsl()); g.addColorStop(1, hsl());
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    } else if (cfg.kind === 'text') {
      ctx.fillStyle = hsl(); ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#fff'; ctx.font = '16px monospace';
      for (let y = 18; y < h; y += 20) ctx.fillText(Array.from({ length: 16 }, () => Math.floor(rng() * 10)).join(' '), 6, y);
    } else {                                                    // noise: incompressible, big payload
      const img = ctx.createImageData(w, h), d = img.data;
      for (let p = 0; p < d.length; p += 4) { d[p] = rng() * 256; d[p + 1] = rng() * 256; d[p + 2] = rng() * 256; d[p + 3] = 255; }
      ctx.putImageData(img, 0, 0);
    }
  }
  cells.forEach(paint);                                          // initial content, never blank

  function pick(tick) {
    const n = cfg.regions, out = [];
    if (cfg.pattern === 'random') { const pool = [...Array(total).keys()]; for (let i = 0; i < n; i++) out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]); }
    else if (cfg.pattern === 'sweep') { for (let i = 0; i < n; i++) out.push((tick + i) % total); }
    else { for (let i = 0; i < n; i++) out.push(Math.floor(i * total / n)); }
    return out;
  }

  const rg = { cfg, log: [], _run: false, _tick: 0, _done: false, _t0: 0, _last: 0 };
  function frame(now) {
    if (!rg._run) return;
    if (now - rg._last >= 1000 / cfg.rate - 2) {
      rg._last = now;
      const idx = pick(rg._tick);
      idx.forEach(i => paint(cells[i]));                         // all in this one frame
      rg.log.push({ tick: rg._tick, t: Math.round(now - rg._t0), cells: idx });
      rg._tick++;
      if (cfg.ticks && rg._tick >= cfg.ticks) { rg._run = false; rg._done = true; document.body.dataset.state = 'done'; return; }
    }
    requestAnimationFrame(frame);
  }
  rg.start = () => { if (rg._run) return; rg._run = true; rg._done = false; rg._tick = 0; rg.log.length = 0;
    document.body.dataset.state = 'running'; rg._t0 = rg._last = performance.now(); requestAnimationFrame(frame); };
  rg.stop = () => { rg._run = false; document.body.dataset.state = 'stopped'; };
  rg.state = () => ({ running: rg._run, tick: rg._tick, done: rg._done });
  window.__rg = rg;
  document.body.dataset.state = 'ready';
  document.getElementById('go').onclick = rg.start;
  document.getElementById('halt').onclick = rg.stop;
  if (cfg.auto) rg.start();
})();
</script>
</body>
</html>
