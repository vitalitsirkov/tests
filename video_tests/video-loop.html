<!doctype html><meta charset="utf-8"><title>video loop</title>
<body style="margin:0;background:#fff">
<p style="margin:8px;font:14px sans-serif">Looping muted 1080p clip (Big Buck Bunny, 10 s; self-hosted copy, CC-BY, test-videos.co.uk). State: <b id="st">?</b></p>
<video id="v" src="bbb_1080_10s.mp4" width="960" height="540" autoplay muted loop playsinline controls></video>
<p style="margin:8px;font:14px sans-serif">Static text below the video, to check that tiles outside the video stay unchanged.</p>
<script>
var v=document.getElementById('v'),st=document.getElementById('st');
v.play().catch(function(e){st.textContent='play rejected: '+e.name});
setInterval(function(){st.textContent=(v.paused?'paused':'playing')+' t='+v.currentTime.toFixed(1)+' err='+(v.error?v.error.code:0)+' rs='+v.readyState},200);
</script>
