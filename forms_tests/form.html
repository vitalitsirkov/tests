<!doctype html><html><head><meta charset="utf-8"><title>form test</title>
<style>body{font:16px Arial;margin:24px;background:#fff;color:#111}label{display:block;margin:14px 0 4px;font-weight:bold}
textarea{width:620px;height:140px;font:16px Georgia}input[type=text]{width:620px;font:16px Georgia;padding:4px}select{font:16px Arial;width:300px;padding:4px}
.box{border:1px solid #888;padding:10px;width:660px;margin-top:20px}</style></head><body>
<h2>Form test (caret, typing, dropdown)</h2>
<label for="t1">Title</label><input type="text" id="t1" value="">
<label for="c1">Comment</label><textarea id="c1"></textarea>
<label for="s1">Priority</label><select id="s1"><option>Lowest</option><option>Low</option><option selected>Medium</option><option>High</option><option>Highest</option><option>Blocker</option></select>
<div class="box">Static text below the form, it must not change while typing: the quick brown fox jumps over the lazy dog 0123456789.</div>
</body></html>
