<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>xorix-noise: waiting</title>
<style>
  body { margin: 0; padding: 16px; font-family: Arial, sans-serif; background: #fff; color: #222; }
  #state { font-size: 13px; margin: 8px 0; }
  canvas { display: block; border: 1px solid #ccc; }
  p { font-size: 15px; line-height: 1.5; width: 640px; }
</style>
</head>
<body>
<h3>Xorix noise test</h3>
<div id="state">state: waiting</div>
<canvas id="c" width="640" height="360"></canvas>
<p>Static text below the canvas. It never changes, so it should never be re-sent. The canvas above is redrawn every frame with a smooth gradient plus uniform noise of 0..AMP per colour channel, so two consecutive frames differ by at most AMP in any channel.</p>
<script>
// Parameters: ?amp=N (noise amplitude, 0..255, default 8), ?dur=S (seconds, default 20), ?fps=F (default 15)
var q = new URLSearchParams(location.search);
var AMP = Number(q.get("amp") || 8), DUR = Number(q.get("dur") || 20) * 1000, FPS = Number(q.get("fps") || 15);
var DELAY = 3000;

// Deterministic PRNG (mulberry32), same sequence on every load.
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rand = rng(12345);

var cv = document.getElementById("c"), ctx = cv.getContext("2d"), st = document.getElementById("state");
var W = cv.width, H = cv.height;
var img = ctx.createImageData(W, H), d = img.data;

// Smooth base gradient, fixed.
var base = new Uint8Array(W * H * 3);
for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
  var i = (y * W + x) * 3;
  base[i] = 40 + (x / W) * 150;
  base[i + 1] = 60 + (y / H) * 120;
  base[i + 2] = 200 - (x / W) * 100;
}

function frame() {
  for (var p = 0, i = 0; p < W * H; p++, i += 3) {
    var o = p * 4;
    d[o] = base[i] + rand() * AMP;
    d[o + 1] = base[i + 1] + rand() * AMP;
    d[o + 2] = base[i + 2] + rand() * AMP;
    d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

var t0 = performance.now(), timer = null;
frame();
setTimeout(function () {
  var t1 = performance.now();
  document.title = "xorix-noise: running";
  timer = setInterval(function () {
    var el = performance.now() - t1;
    if (el >= DUR) { clearInterval(timer); document.title = "xorix-noise: DONE"; st.textContent = "state: DONE (amp=" + AMP + ")"; return; }
    st.textContent = "state: running amp=" + AMP + " " + Math.round(el / 1000) + "/" + (DUR / 1000) + "s";
    frame();
  }, 1000 / FPS);
}, DELAY);
</script>
</body>
</html>
